name: tests

on:
  push:
    branches: [main, maintenance-release]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: PHP ${{ matrix.php }} — Laravel ${{ matrix.laravel }} — Livewire ${{ matrix.livewire }}

    strategy:
      fail-fast: false
      matrix:
        php: [8.2, 8.3, 8.4, 8.5]
        laravel: ['12.*', '13.*']
        livewire: ['^3.8.3', '^4.4.8']
        include:
          - laravel: '12.*'
            testbench: '^10.0'
          - laravel: '13.*'
            testbench: '^11.0'
        exclude:
          # Laravel 13 requires PHP >= 8.3 (and pest-plugin-laravel 4.x,
          # which is what unlocks Laravel 13 support, requires PHP >= 8.3 too)
          - laravel: '13.*'
            php: 8.2

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, fileinfo, gd, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-php${{ matrix.php }}-laravel${{ matrix.laravel }}-livewire${{ matrix.livewire }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-php${{ matrix.php }}-laravel${{ matrix.laravel }}-

      - name: Set matrix dependency versions
        run: |
          composer update --with "laravel/framework:${{ matrix.laravel }}" \
                            --with "orchestra/testbench:${{ matrix.testbench }}" \
                            --with "livewire/livewire:${{ matrix.livewire }}" \
                            --no-interaction --no-install --no-progress

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Audit dependencies
        run: composer audit --locked

      - name: Run tests
        run: vendor/bin/pest --colors=always

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Browser — Laravel ${{ matrix.laravel }} — Livewire ${{ matrix.livewire }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - laravel: '12.*'
            testbench: '^10.0'
            livewire: '^3.8.3'
          - laravel: '13.*'
            testbench: '^11.0'
            livewire: '^4.4.8'
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, gd, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install matrix dependencies
        run: |
          composer update --with "laravel/framework:${{ matrix.laravel }}" \
                          --with "orchestra/testbench:${{ matrix.testbench }}" \
                          --with "livewire/livewire:${{ matrix.livewire }}" \
                          --prefer-dist --no-interaction --no-progress
      - run: composer audit --locked
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Upload browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-traces-${{ strategy.job-index }}
          path: test-results/
          retention-days: 7
